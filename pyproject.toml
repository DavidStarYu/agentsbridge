[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsbridge"
version = "0.1.0"
description = "Bridge AGENTS.md to every AI coding tool's rules file - one source of truth for Claude Code, Copilot, Cursor, Windsurf, Cline, and Aider."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agentsbridge contributors" }]
keywords = [
    "agents-md", "claude", "claude-code", "cursor", "copilot", "windsurf",
    "cline", "aider", "ai", "rules", "cli", "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/agentsbridge/agentsbridge"
Repository = "https://github.com/agentsbridge/agentsbridge"
Changelog = "https://github.com/agentsbridge/agentsbridge/blob/main/CHANGELOG.md"

[project.scripts]
agentsbridge = "agentsbridge.cli:main"

[tool.setuptools]
packages = ["agentsbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
