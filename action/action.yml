name: 'AgentsBridge Check'
description: >
  Verify that generated AI rules files (CLAUDE.md, copilot-instructions.md,
  Cursor rules, ...) are up to date with AGENTS.md. Fails the workflow on drift.
branding:
  icon: 'refresh-cw'
  color: 'purple'

inputs:
  targets:
    description: 'Comma-separated subset of targets (default: all)'
    required: false
    default: ''
  working-directory:
    description: 'Directory containing AGENTS.md'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install agentsbridge
      shell: bash
      run: pip install agentsbridge || pip install .
    - name: Run agentsbridge check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: agentsbridge check ${{ inputs.targets && format('-t {0}', inputs.targets) || '' }}
